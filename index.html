<html lang="pt-BR">

<div id="cabinet">
    <div id="screen" class="fx">
      <div class="jitter content">
        <header class="hdr">
          <div class="paddles">
            <svg class="paddle" viewBox="0 0 14 20" shape-rendering="crispEdges" aria-hidden="true" style="transform: rotate(-26deg);">
              <use href="#paddle"></use>
            </svg>
            <svg class="ball bounce" viewBox="0 0 6 6" shape-rendering="crispEdges" aria-hidden="true">
              <path fill="#f4f7ff" d="M1 1h3v1h-3zM1 2h4v1h-4zM1 3h4v1h-4zM2 4h2v1h-2z"/>
              <path fill="#b9c6f2" d="M4 1h1v1h-1zM1 4h1v1h-1zM4 4h1v1h-1z"/>

            <svg class="paddle" viewBox="0 0 14 20" shape-rendering="crispEdges" aria-hidden="true" style="transform: scaleX(-1) rotate(-26deg);">
              <use href="#paddle"></use>
            </svg>
          </div>
          <div class="titles">
            <h1 class="rgb glow title">DISPUTA ELSYS</h1>
            <div class="vt subtitle">TÊNIS DE MESA · MELHOR DE 3</div>
          </div>
        </header>

        <div id="tabbar"></div>
        <div id="view" class="view"></div>

        <footer class="vt foot">
          <span>JOGO ATÉ 11 · VANTAGEM DE 2</span>
          <span class="blink">SAQUE É DE QUEM PONTUA</span>
        </footer>
      </div>

      <div class="roll"></div>
      <div class="flash"></div>
      <div class="tear"></div>
      <div class="px" style="left: 13%; top: 24%; background: #ff3b47;"></div>
      <div class="px" style="left: calc(13% + clamp(6px, 2vmin, 22px)); top: 24%; background: #39ff7a;"></div>
      <div class="px" style="right: 17%; top: 50%; background: #39ff7a;"></div>
      <div class="px" style="right: calc(17% + clamp(6px, 2vmin, 22px)); top: calc(50% + clamp(6px, 2vmin, 22px)); background: #ff3b47;"></div>
      <div class="px wide" style="left: 42%; top: 79%; background: #ff3b47;"></div>
      <div class="px dot" style="right: 9%; top: 15%; background: #f4f7ff;"></div>
      <div class="scan"></div>
      <div class="vig"></div>
    </div>
</div>
